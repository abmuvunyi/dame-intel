version: '3.8'

services:
  db:
    image: postgres:15
    container_name: draughts_db
    environment:
      POSTGRES_USER: draughts_user
      POSTGRES_PASSWORD: draughts_password
      POSTGRES_DB: draughts_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: draughts_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
